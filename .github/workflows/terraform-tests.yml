name: Terraform Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.9.8"
  TFLINT_VERSION: "v0.53.0"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt -check -recursive
        run: terraform fmt -check -recursive -diff

  docs:
    name: terraform-docs (README in sync)
    runs-on: ubuntu-latest
    env:
      # Tracks the version `brew install terraform-docs` installs on macOS, so
      # contributors don't need a special install path. Different terraform-docs
      # versions emit different markdown table whitespace, so any drift between
      # CI and the version contributors actually use produces spurious diffs.
      # Bump together with the brew default.
      TERRAFORM_DOCS_VERSION: v0.24.0
    steps:
      - uses: actions/checkout@v4

      - name: install terraform-docs
        run: |
          set -euo pipefail
          curl -sSLo /tmp/td.tar.gz \
            "https://terraform-docs.io/dl/${TERRAFORM_DOCS_VERSION}/terraform-docs-${TERRAFORM_DOCS_VERSION}-$(uname)-amd64.tar.gz"
          tar -xzf /tmp/td.tar.gz -C /tmp terraform-docs
          sudo install -m 0755 /tmp/terraform-docs /usr/local/bin/terraform-docs
          terraform-docs --version

      # All formatting options live in .terraform-docs.yml so these commands
      # stay identical to what contributors run locally.
      - name: terraform-docs --output-check (root)
        run: terraform-docs --output-check .

      - name: terraform-docs --output-check (examples/small)
        working-directory: examples/small
        run: terraform-docs --output-check .

      - name: terraform-docs --output-check (examples/cloudflare)
        working-directory: examples/cloudflare
        run: terraform-docs --output-check .

      - name: terraform-docs --output-check (examples/godaddy)
        working-directory: examples/godaddy
        run: terraform-docs --output-check .

      - name: terraform-docs --output-check (examples/split-ingress)
        working-directory: examples/split-ingress
        run: terraform-docs --output-check .

      - name: terraform-docs --output-check (examples/medium)
        working-directory: examples/medium
        run: terraform-docs --output-check .

      - name: terraform-docs --output-check (examples/large)
        working-directory: examples/large
        run: terraform-docs --output-check .

      - name: terraform-docs --output-check (examples/customer-managed-cluster)
        working-directory: examples/customer-managed-cluster
        run: terraform-docs --output-check .

      - name: terraform-docs --output-check (examples/customer-managed-redis)
        working-directory: examples/customer-managed-redis
        run: terraform-docs --output-check .

      - name: terraform-docs --output-check (examples/customer-managed-gcs)
        working-directory: examples/customer-managed-gcs
        run: terraform-docs --output-check .

      - name: terraform-docs --output-check (examples/customer-managed-everything)
        working-directory: examples/customer-managed-everything
        run: terraform-docs --output-check .

      # modules/controllers is not the recursive-path default for a bare
      # `terraform-docs .` invocation from inside modules/, so it needs the
      # root config passed explicitly (see AGENTS.md).
      - name: terraform-docs --output-check (modules/controllers)
        working-directory: modules/controllers
        run: terraform-docs --config ../../.terraform-docs.yml --output-check .

      - name: terraform-docs --output-check (modules/controllers/examples/direct-use)
        working-directory: modules/controllers/examples/direct-use
        run: terraform-docs --config ../../../../.terraform-docs.yml --output-check .

  validate:
    name: terraform validate (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          [
            ".",
            "examples/small",
            "examples/cloudflare",
            "examples/godaddy",
            "examples/split-ingress",
            "examples/medium",
            "examples/large",
            "examples/customer-managed-cluster",
            "examples/customer-managed-redis",
            "examples/customer-managed-gcs",
            "examples/customer-managed-everything",
            "modules/controllers",
            "modules/controllers/examples/direct-use",
          ]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init (no backend, providers only)
        working-directory: ${{ matrix.target }}
        run: terraform init -backend=false

      - name: terraform validate
        working-directory: ${{ matrix.target }}
        run: terraform validate -no-color

  test:
    name: terraform test (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: validate
    env:
      # Stub credentials so the veksh/godaddy-dns provider initializes during
      # terraform test. Scoped to this job only, no real GoDaddy API calls
      # are made; godaddy-dns_record resources use for_each over an attribute
      # that is unknown under a mocked google provider, which evaluates to an
      # empty map at plan time. Other jobs (fmt, validate, tflint, checkov)
      # don't need these set.
      GODADDY_API_KEY: "ci-stub-not-real"
      GODADDY_API_SECRET: "ci-stub-not-real"
    strategy:
      fail-fast: false
      matrix:
        target:
          [
            ".",
            "examples/small",
            "examples/cloudflare",
            "examples/godaddy",
            "examples/split-ingress",
            "examples/medium",
            "examples/large",
            "examples/customer-managed-cluster",
            "examples/customer-managed-redis",
            "examples/customer-managed-gcs",
            "examples/customer-managed-everything",
            "modules/controllers",
            "modules/controllers/examples/direct-use",
          ]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init
        working-directory: ${{ matrix.target }}
        run: terraform init -backend=false

      - name: terraform test
        working-directory: ${{ matrix.target }}
        run: terraform test -verbose

  chart-render:
    name: n8n chart rendering check
    runs-on: ubuntu-latest
    env:
      # Pinned to the exact Helm CLI version the chart-rendering fixtures in
      # tests/scripts/check-n8n-chart.sh were authored and verified against
      # (see the section-1 baseline report). OCI chart pulls only need Helm
      # 3.8+, but pinning keeps local and CI `helm template` output identical.
      HELM_VERSION: "v4.3.0"
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: tests/scripts/check-n8n-chart.sh
        run: tests/scripts/check-n8n-chart.sh

  tflint:
    name: tflint (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          [
            ".",
            "examples/small",
            "examples/cloudflare",
            "examples/godaddy",
            "examples/split-ingress",
            "examples/medium",
            "examples/large",
            "examples/customer-managed-cluster",
            "examples/customer-managed-redis",
            "examples/customer-managed-gcs",
            "examples/customer-managed-everything",
            "modules/controllers",
            "modules/controllers/examples/direct-use",
          ]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: terraform init (fetch modules for tflint)
        working-directory: ${{ matrix.target }}
        run: terraform init -backend=false

      - name: tflint --init
        working-directory: ${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tflint --init

      - name: tflint
        working-directory: ${{ matrix.target }}
        run: tflint --format compact

  checkov:
    name: checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: checkov
        # Pinned to the checkov-action release tag whose bundled Docker image
        # is ghcr.io/bridgecrewio/checkov:3.3.17 (the action has no separate
        # checkov-version input; its own action.yml bakes in a Checkov tag per
        # release, so the action ref itself is the pin). Local runs install
        # the matching `checkov==3.3.17` (e.g. `uv tool install checkov==3.3.17`)
        # so `checkov -d .` locally and this job agree; see the security
        # baseline report referenced from CHANGELOG.md for the curated,
        # remaining-finding-free baseline this version was pinned against.
        uses: bridgecrewio/checkov-action@v12.3123.0
        with:
          directory: .
          framework: terraform
          quiet: true
          # The curated baseline (parity-matrix.md / security review for
          # add-google-parity-through-aws-0-4-0) fixes every in-scope finding
          # and narrowly suppresses the rest via inline checkov:skip comments
          # on the specific resources involved (see verification-report.md's
          # section-23 curated run: 110 passed, 0 failed). soft_fail is now
          # false: an unapproved new finding fails this job. Widening this
          # back to true requires a documented reason and a follow-up.
          soft_fail: false
          output_format: cli
          output_file_path: console
